<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{titlu}}</title></head>
<body style="margin:0;background:#f4efe7;font-family:Georgia,'Times New Roman',serif;color:#1b1a17">
<!-- Email către oaspete. Același șablon pentru: cerere primită, confirmată, refuzată (titlu + mesaj diferite). -->
<div style="max-width:560px;margin:0 auto;padding:32px 20px">
  <p style="font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#5d584f;margin:0 0 28px;font-family:Arial,sans-serif">{{numeProprietate}}</p>
  <h1 style="font-weight:400;font-size:34px;line-height:1.1;margin:0 0 16px">{{titlu}}</h1>
  <p style="font-size:17px;line-height:1.6;margin:0 0 28px;font-family:Arial,sans-serif">Bună, {{prenume}}! {{mesaj}}</p>
  <table role="presentation" style="width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:15px;background:#fff;border-radius:6px">
    <tr><td style="padding:12px 16px;color:#5d584f;border-bottom:1px solid #eee">Sosire</td><td style="padding:12px 16px;border-bottom:1px solid #eee;text-align:right"><b>{{checkIn}}</b></td></tr>
    <tr><td style="padding:12px 16px;color:#5d584f;border-bottom:1px solid #eee">Plecare</td><td style="padding:12px 16px;border-bottom:1px solid #eee;text-align:right"><b>{{checkOut}}</b></td></tr>
    <tr><td style="padding:12px 16px;color:#5d584f;border-bottom:1px solid #eee">Nopți</td><td style="padding:12px 16px;border-bottom:1px solid #eee;text-align:right">{{nopti}}</td></tr>
    <tr><td style="padding:12px 16px;color:#5d584f;border-bottom:1px solid #eee">Oaspeți</td><td style="padding:12px 16px;border-bottom:1px solid #eee;text-align:right">{{oaspeti}}</td></tr>
    <tr><td style="padding:12px 16px;color:#5d584f;border-bottom:1px solid #eee">Camera</td><td style="padding:12px 16px;border-bottom:1px solid #eee;text-align:right">{{camere}}</td></tr>
    <tr><td style="padding:12px 16px;color:#5d584f">Total estimat</td><td style="padding:12px 16px;text-align:right;font-size:18px"><b>{{total}}</b></td></tr>
  </table>
  <p style="font-family:Arial,sans-serif;font-size:14px;line-height:1.6;color:#5d584f;margin:24px 0 0"><b style="color:#1b1a17">Avans:</b> {{avans}}<br><b style="color:#1b1a17">Anulare:</b> {{anulare}}</p>
  <p style="font-family:Arial,sans-serif;font-size:14px;color:#5d584f;margin:16px 0 0">Nr. cerere: {{id}}</p>
  <p style="font-family:Arial,sans-serif;font-size:15px;line-height:1.6;margin:32px 0 0">Întrebări? {{{contactGazda}}}</p>
</div></body></html>
