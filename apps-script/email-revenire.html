<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{numeProprietate}}</title></head>
<body style="margin:0;background:#f4efe7;font-family:Georgia,'Times New Roman',serif;color:#1b1a17">
<!-- Email de revenire: doar către oaspeții care au bifat acordul pentru oferte. -->
<div style="max-width:560px;margin:0 auto;padding:32px 20px">
  <p style="font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#5d584f;margin:0 0 28px;font-family:Arial,sans-serif">{{numeProprietate}}</p>
  <h1 style="font-weight:400;font-size:34px;line-height:1.1;margin:0 0 16px">Ne-ar plăcea să vă revedem, {{prenume}}</h1>
  <p style="font-size:17px;line-height:1.6;margin:0 0 28px;font-family:Arial,sans-serif">{{mesaj}}</p>
  <p><a href="{{siteUrl}}" style="display:inline-block;background:{{culoare}};color:#fff;text-decoration:none;padding:14px 26px;border-radius:999px;font-family:Arial,sans-serif;font-weight:bold">Vezi datele libere</a></p>
  <p style="font-family:Arial,sans-serif;font-size:12px;color:#5d584f;margin:40px 0 0">Primești acest email pentru că ai bifat acordul pentru oferte la rezervarea din {{checkIn}}. Nu mai vrei? Răspunde cu „dezabonare”.</p>
</div></body></html>
