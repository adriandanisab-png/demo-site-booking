<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Ne vedem curând</title></head>
<body style="margin:0;background:#f4efe7;font-family:Georgia,'Times New Roman',serif;color:#1b1a17">
<!-- Email către oaspete, cu câteva zile înainte de sosire. Textul principal vine din infoSosire (foaia Setari). -->
<div style="max-width:560px;margin:0 auto;padding:32px 20px">
  <p style="font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#5d584f;margin:0 0 28px;font-family:Arial,sans-serif">{{numeProprietate}}</p>
  <h1 style="font-weight:400;font-size:34px;line-height:1.1;margin:0 0 16px">Ne vedem curând, {{prenume}}</h1>
  <p style="font-size:17px;line-height:1.6;margin:0 0 24px;font-family:Arial,sans-serif">Sosiți <b>{{checkIn}}</b> și plecați <b>{{checkOut}}</b>. Ca să nu fie nevoie să ne sunați pentru detalii, le-am pus aici:</p>
  <div style="background:#fff;border-radius:6px;padding:20px;font-family:Arial,sans-serif;font-size:16px;line-height:1.65">{{{infoSosire}}}</div>
  {{{butonHarta}}}
  <p style="font-family:Arial,sans-serif;font-size:15px;line-height:1.6;margin:32px 0 0">Ceva neclar sau întârziați? {{{contactGazda}}}</p>
  <p style="font-family:Arial,sans-serif;font-size:13px;color:#5d584f;margin:16px 0 0">Rezervarea {{id}} · {{oaspeti}} · {{camere}}</p>
</div></body></html>
